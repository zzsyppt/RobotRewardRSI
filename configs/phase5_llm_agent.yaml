schema_version: humanoid_agent.phase5.llm_agent.config.v1

provider:
  default: dry_run
  deepseek:
    type: openai_compatible
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    endpoint: /chat/completions
    model: deepseek-v4-pro
    timeout_seconds: 120
    temperature: 0.2
    max_tokens: 8192
    reasoning_effort: high
    thinking:
      type: enabled
    response_format:
      type: json_object
  dry_run:
    type: dry_run
    model: deterministic-local-phase5-dry-run
  replay:
    type: replay
    model: replayed-response
  custom_openai_compatible:
    type: openai_compatible
    api_key_env: PHASE5_LLM_API_KEY
    base_url_env: PHASE5_LLM_BASE_URL
    model_env: PHASE5_LLM_MODEL
    endpoint: /chat/completions
    timeout_seconds: 120
    temperature: 0.2
    max_tokens: 8192
    response_format:
      type: json_object

prompt:
  project_plan: humanoid_agentic_policy_improvement_plan_v3.md
  instruction: >
    Propose exactly one config-level intervention for standing push recovery.
    You must reason from public summary and diagnostics only. Do not ask for
    hidden/IID results, secrets, or manual reward-code changes.
  max_summary_chars: 24000

patch_contract:
  documents:
    phase1: configs/phase1_push_recovery.yaml
    phase2: configs/phase2_baseline.yaml
  allowed_paths:
    phase1:
      - profiles.phase2_train.push.interval_range_s
      - profiles.phase2_train.push.velocity_range_mps.x
      - profiles.phase2_train.push.velocity_range_mps.y
    phase2:
      - baseline.name
      - baseline.description
      - reward_weights.*
      - reward_params.*
      - ppo.*
  max_operations: 16
  require_operation_reason: true
  reward_weight_bounds_source: configs/phase4_rule_baseline.yaml
  push_velocity_abs_max_mps: 0.6
  push_interval_s_bounds: [0.5, 4.0]

acceptance_contract:
  verifier_config: configs/phase3_verifier.yaml
  require_static_verifier_pass: true
  next_step_after_proposal: >
    If the candidate passes static verifier, run a train-start smoke first.
    Formal Phase 5 accept/reject then trains public seeds under a fixed external
    budget and does not expose iid-hidden results back to the Agent.
