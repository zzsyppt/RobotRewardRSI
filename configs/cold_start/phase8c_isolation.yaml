{
  "schema_version": "humanoid_agent.phase8c.isolation.config.v1",
  "phase": "8C-isolation",
  "summary_schema_version": "humanoid_agent.phase8c.isolation.summary.v1",
  "isolation": {
    "candidate_code_process": "separate_subprocess",
    "require_network_namespace": true,
    "require_pid_namespace": true,
    "require_landlock": true,
    "network_namespace_command": ["unshare", "-Urnfp", "--mount-proc"],
    "filesystem_policy": "landlock_minimal_candidate_api_readonly_candidate_code_readwrite_candidate_output_runner_artifacts_unwritable",
    "environment_policy": "allowlist_no_secret_keys",
    "timeout_seconds": 30,
    "env_allowlist": [
      "PATH",
      "LANG",
      "LC_ALL",
      "LD_LIBRARY_PATH",
      "CUDA_VISIBLE_DEVICES",
      "NVIDIA_VISIBLE_DEVICES",
      "NVIDIA_DRIVER_CAPABILITIES"
    ],
    "unsupported_features": {
      "docker": "not required; current server user cannot access docker.sock",
      "bind_mount_readonly_repo": "not required; current server rejects unprivileged bind mount, Landlock is used instead",
      "whole_repo_read": "intentionally not allowed; repo configs contain protected eval profiles and seeds"
    }
  },
  "candidate_policy": {
    "allowed_schema_version": "humanoid_agent.cold_start.candidate.v1",
    "allow_llm_authored_after_isolation": false,
    "require_noop_components_for_selftest": true
  },
  "acceptance": {
    "noop_candidate_must_pass": true,
    "secret_env_must_be_absent": true,
    "hidden_file_read_must_fail": true,
    "repo_write_must_fail": true,
    "network_connect_must_fail": true,
    "residual_child_process_must_be_absent": true
  }
}
