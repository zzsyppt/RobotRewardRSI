{
  "schema_version": "humanoid_agent.phase8d.verifier.config.v1",
  "phase": "8D-code-verifier",
  "summary_schema_version": "humanoid_agent.phase8d.verifier.summary.v1",
  "phase8c_isolation_config": "configs/cold_start/phase8c_isolation.yaml",
  "static": {
    "max_files": 64,
    "max_total_bytes": 1048576,
    "max_file_bytes": 262144,
    "allowed_top_level_entries": [
      "candidate_manifest.yaml",
      "training_code",
      "rationale.md",
      "operation_diff.json",
      "diagnostics.json"
    ],
    "allowed_file_suffixes": [".py", ".yaml", ".yml", ".json", ".md", ".txt"],
    "forbidden_path_parts": [
      ".git",
      "__pycache__",
      ".pytest_cache",
      ".mypy_cache",
      ".ruff_cache"
    ],
    "forbidden_import_roots": [
      "base64",
      "builtins",
      "ctypes",
      "ftplib",
      "glob",
      "http",
      "importlib",
      "multiprocessing",
      "os",
      "pathlib",
      "pickle",
      "requests",
      "shutil",
      "socket",
      "subprocess",
      "threading",
      "urllib"
    ],
    "forbidden_call_names": [
      "eval",
      "exec",
      "compile",
      "open",
      "__import__",
      "input",
      "breakpoint",
      "getattr",
      "setattr",
      "globals",
      "locals",
      "vars",
      "dir"
    ],
    "forbidden_manifest_capabilities": [
      "runner_hook",
      "ppo_loop_hook",
      "env_step_dispatcher",
      "optimizer_hook",
      "checkpoint_selector",
      "eval_wrapper",
      "success_classifier",
      "process_control",
      "network",
      "filesystem",
      "secrets",
      "hidden_eval"
    ],
    "forbidden_string_tokens": [
      "iid_hidden",
      "iid-hidden",
      "phase2_iid_hidden",
      "iid_hidden_eval",
      "iid_hidden_success_rate",
      "hidden_audit",
      "hidden_eval",
      "accept_reject",
      "DEEPSEEK_API_KEY",
      "OPENAI_API_KEY",
      "api_key",
      "secret"
    ],
    "forbidden_numeric_tokens": [1001, 2001]
  },
  "dynamic": {
    "require_phase8c_isolation": true,
    "allow_llm_authored_in_isolated_verifier": true,
    "require_noop_components": false,
    "scan_public_component_summary": true,
    "fast_validation": {
      "enabled": true,
      "num_envs": 4,
      "num_joints": 29,
      "num_actions": 29,
      "progress_points": [0.0, 0.5, 1.0],
      "prefer_torch": true
    }
  },
  "notes": {
    "scope": "Phase8D verifies candidate package and isolated component loading. It does not run full Isaac/RSL-RL training.",
    "non_goals": [
      "full reward callable execution in PPO loop",
      "optimizer/gradient runtime hook accounting",
      "eval observation/action wrapper execution"
    ]
  }
}
