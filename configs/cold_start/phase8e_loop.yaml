{
  "schema_version": "humanoid_agent.phase8e.loop.config.v1",
  "phase": "8E-single-agent-code-level-cold-start-loop",
  "summary_schema_version": "humanoid_agent.phase8e.loop.summary.v1",
  "task": {
    "task_id": "g1_standing_push_recovery_cold_start",
    "robot": "Unitree G1 29DoF",
    "objective": "maximize fixed public standing push-recovery success from random policy initialization",
    "policy_initialization": "random_each_candidate",
    "reference_only": {
      "config_warm_reference_kept": true,
      "not_used_as_training_start": true
    }
  },
  "paths": {
    "run_root": "/data/yuyangliu/runs/phase_8_cold_start_autoresearch",
    "lab_dir": null,
    "ledger_filename": "phase8e_ledger.jsonl",
    "accepted_recipes_dirname": "accepted_recipes",
    "prompt_messages_filename": "phase8e_prompt_messages.json",
    "prompt_payload_filename": "phase8e_prompt_payload.json",
    "prompt_text_filename": "phase8e_prompt.txt",
    "round_summary_filename": "phase8e_round_summary.json",
    "current_best_recipe_dirname": "current_best_recipe",
    "lab_dir_note": "Set lab_dir to a stable path for multi-round inheritance; the ledger and immutable accepted_recipes snapshots live here, while run_dir holds only per-round artifacts. Null falls back to run_dir (single-directory usage only)."
  },
  "initial_recipe": {
    "label": "minimal_human_noop_reference",
    "path": "examples/cold_start_candidates/noop_candidate",
    "policy_start": "random; no checkpoint inheritance"
  },
  "verifier": {
    "phase": "8D",
    "config_path": "configs/cold_start/phase8d_verifier.yaml",
    "must_pass_before_training": true
  },
  "runner": {
    "budget_config_path": "configs/cold_start/phase8b_budget.yaml",
    "safety_model_config_path": "configs/cold_start/phase8e_safety_model.yaml",
    "formal_training_enabled_in_phase8e_scaffold": false,
    "phase8e_3_training_adapter_available": true,
    "note": "Phase8E scaffold prepares and verifies candidates only. Phase8E-3 wires callable components into the runner-owned train smoke via --candidate-dir; formal long training/eval remains an explicit immutable-runner action."
  },
  "full_round": {
    "summary_filename": "phase8e_full_round_summary.json",
    "training": {
      "boundary": "minimal_rootfs_pivot_root",
      "script": "scripts/phase8e_minimal_rootfs_probe.py",
      "summary_filename": "train_start_smoke_summary.json",
      "timeout_seconds_note": "Authoritative timeout/max_iterations/num_envs come from configs/cold_start/phase8b_budget.yaml."
    },
    "public_rollout": {
      "script": "scripts/phase1_push_recovery_eval.py",
      "profile": "phase2_public",
      "policy": "checkpoint",
      "num_envs": 64,
      "max_steps": 200,
      "timeout_seconds": 1800,
      "dev_seeds": [1101, 1102, 1103],
      "accept_seeds": [2101, 2102, 2103],
      "seed_visibility": "runner_owned_raw_rollout_only; public_result projects to run_index and aggregate success metrics before LLM feedback."
    }
  },
  "provider": {
    "default": "deepseek",
    "dry_run": {
      "type": "dry_run",
      "model": "deterministic-local-phase8e-dry-run"
    },
    "replay": {
      "type": "replay",
      "model": "replayed-response"
    },
    "deepseek": {
      "type": "openai_compatible",
      "api_key_env": "DEEPSEEK_API_KEY",
      "base_url": "https://api.deepseek.com",
      "endpoint": "/chat/completions",
      "model": "deepseek-v4-pro",
      "timeout_seconds": 120,
      "temperature": 0.2,
      "max_tokens": 8192,
      "reasoning_effort": "high",
      "thinking": {
        "type": "enabled"
      },
      "response_format": {
        "type": "json_object"
      }
    },
    "glm": {
      "type": "openai_compatible",
      "api_key_env": "GLM_API_KEY",
      "base_url_env": "GLM_BASE_URL",
      "model_env": "GLM_MODEL",
      "endpoint": "/chat/completions",
      "timeout_seconds": 120,
      "temperature": 0.2,
      "max_tokens": 8192,
      "response_format": {
        "type": "json_object"
      }
    },
    "custom_openai_compatible": {
      "type": "openai_compatible",
      "api_key_env": "PHASE8E_LLM_API_KEY",
      "base_url_env": "PHASE8E_LLM_BASE_URL",
      "model_env": "PHASE8E_LLM_MODEL",
      "endpoint": "/chat/completions",
      "timeout_seconds": 120,
      "temperature": 0.2,
      "max_tokens": 8192,
      "response_format": {
        "type": "json_object"
      }
    }
  },
  "candidate_capabilities": {
    "allowed": [
      "RewardTerm callables over public RewardInputs",
      "LossTerm callables over public RewardInputs",
      "ScheduleTerm callables pre-evaluated on public progress points",
      "training-only domain randomization schedules through runner-whitelisted keys",
      "DiagnosticTerm callables over public RewardInputs returning numeric public summaries"
    ],
    "forbidden": [
      "runner hook",
      "PPO loop hook",
      "optimizer hook",
      "env-step dispatcher",
      "checkpoint selector",
      "eval observation wrapper",
      "eval action wrapper",
      "success metric",
      "budget or seed changes",
      "network/filesystem/process control"
    ]
  },
  "acceptance": {
    "no_accept_without_public_accept": true,
    "near_zero_success_threshold": 0.02,
    "absolute_dev_seed_floor": 0.03,
    "absolute_dev_min_passing_runs": 2,
    "absolute_accept_success_floor": 0.05,
    "public_min_delta": 0.05,
    "required_pass_gates": [
      "budget_accounting",
      "motion_quality_gate"
    ],
    "notes": [
      "public_dev floor can mark a candidate promising, but cannot accept it",
      "public_accept plus required gates is needed before recipe inheritance",
      "ood_stress_gate is emitted as diagnostic/not_run in Phase 8E-6-1 and becomes required only after a real OOD distribution and thresholds are implemented"
    ]
  },
  "prompt": {
    "include_history_rounds": 5
  },
  "provider_inner_loop": {
    "enabled": true,
    "max_attempts": 3,
    "max_source_read_turns": 2,
    "json_repair_attempts": 1,
    "static_gate_required": true,
    "isolated_dynamic_fast_validation_required": true
  },
  "public_safety": {
    "forbidden_string_tokens": [
      "iid_hidden",
      "iid-hidden",
      "phase2_iid_hidden",
      "iid_hidden_eval",
      "iid_hidden_success_rate",
      "hidden_audit",
      "hidden_eval",
      "accept_reject",
      "DEEPSEEK_API_KEY",
      "OPENAI_API_KEY",
      "api_key",
      "secret"
    ],
    "forbidden_numeric_tokens": [1001, 2001]
  }
}
