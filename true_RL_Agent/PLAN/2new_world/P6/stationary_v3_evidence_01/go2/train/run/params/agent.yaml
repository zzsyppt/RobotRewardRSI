seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 500
empirical_normalization: {}
obs_groups: {}
clip_actions: null
check_for_nan: true
save_interval: 50
experiment_name: unitree_go2_rough
run_name: true_rl_agent_p6-stationary-v3-dev-go2
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: PPO
  clip_param: 0.2
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  learning_rate: 0.001
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  num_learning_epochs: 5
  num_mini_batches: 4
  rnd_cfg: null
  schedule: adaptive
  symmetry_cfg: null
  use_clipped_value_loss: true
  value_loss_coef: 1.0
  optimizer: adam
policy: null
